# $schema: https://raw.githubusercontent.com/helm-unittest/helm-unittest/refs/heads/main/schema/helm-testsuite.json
suite: headless service
templates:
  - service-headless.yaml
tests:
  - it: should render the headless service named in the StatefulSet governing service
    release:
      name: my-release
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: my-release-tempo-headless
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true

  - it: should select the tempo pods
    release:
      name: my-release
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: tempo
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: my-release

  - it: should expose the tempo http port
    asserts:
      - contains:
          path: spec.ports
          content:
            name: tempo-prom-metrics
            port: 3200
            protocol: TCP
            targetPort: 3200

  - it: should carry the service labels and annotations
    set:
      service.labels:
        test-label: test-value
      service.annotations:
        test-annotation: test-value
    asserts:
      - equal:
          path: metadata.labels["test-label"]
          value: test-value
      - equal:
          path: metadata.annotations["test-annotation"]
          value: test-value

  - it: should be excluded from the ServiceMonitor selector
    asserts:
      - equal:
          path: metadata.labels["prometheus.io/service-monitor"]
          value: "false"

  - it: should expose the OTLP HTTP receiver port by default
    asserts:
      - contains:
          path: spec.ports
          content:
            name: tempo-otlp-http
            port: 4318
            protocol: TCP
            targetPort: 4318

  - it: should not expose the OTLP gRPC or Jaeger ports by default
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: grpc-tempo-otlp
          any: true
      - notContains:
          path: spec.ports
          content:
            name: tempo-jaeger-thrift-http
          any: true
